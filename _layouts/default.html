<!DOCTYPE html>
<html lang="{{ page.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    h1, h2, h3 { line-height: 1.25; }
    table { display: block; overflow-x: auto; border-collapse: collapse; }
    th, td { border: 1px solid rgba(128, 128, 128, .4); padding: .4rem .6rem; text-align: left; vertical-align: top; }
    hr { border: 0; border-top: 1px solid rgba(128, 128, 128, .4); margin: 2rem 0; }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>
</body>
</html>
